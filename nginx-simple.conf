server {
    listen 80;
    server_name anukanaka.in www.anukanaka.in;

    # Serve static files directly
    location /static/ {
        alias /home/ubuntu/PersonalWebsite/website/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy to Django
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
